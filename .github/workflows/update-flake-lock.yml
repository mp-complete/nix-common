name: Update flake lock

on:
  schedule:
    # Nightly at an intentionally non-round time to reduce scheduler congestion.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Update lock file
        run: nix flake update
      - name: Validate updated inputs
        run: |
          nix fmt -- --fail-on-change
          bash tests/validate.sh --build
      - name: Open or refresh update pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/flake-lock-update
          delete-branch: true
          add-paths: flake.lock
          commit-message: "flake.lock: update inputs"
          title: "flake.lock: update inputs"
          body: |
            Automated nightly update of all flake inputs.

            The updated lock file passed formatting, flake evaluation, extension tests, and smoke builds before this pull request was created, so it is merged automatically.
      # Pull requests opened with GITHUB_TOKEN do not trigger other workflows, so
      # the validation above is the gate. Only a validated head commit is merged.
      - name: Merge validated update pull request
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --merge --delete-branch --match-head-commit "$PR_HEAD_SHA"
